# Copy to machine.yml (untracked) and list what to install on this machine. This repo's global/ folder always installs
# into ~/.claude, and its workspace/ folder into every workspace below.

# Other toolbox repos to install, each whole: its toolbox.yml names its source folder and target.
toolboxes: []
#  - ~/path/to/another-claude-toolbox

# Workspaces the workspace/ folder installs into. Each needs a .claude/toolbox.local.yml; /setup-workspace writes it and
# adds the workspace here.
workspaces: []
#  - ~/path/to/workspace
