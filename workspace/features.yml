# Which parts of the workspace folder need a feature, and which config a feature needs. install.py installs a listed
# path into a workspace only when that workspace's .claude/toolbox.local.yml lists the feature under `features`;
# anything unlisted always installs, so only the runtime (.claude/toolbox/), toolbox-doctor and the generated
# toolbox-config rule are left unlisted.
#
# Format: {<feature>: [paths relative to workspace/]}, or {<feature>: {paths: [...], needs: [...]}}. A path names a
# file, or a folder and everything under it (a skill folder, say: .claude/skills/start-local-services). A path listed
# under more than one feature needs all of them. Dropping a feature from a workspace's config and re-syncing removes
# those links, like any stale link. A template (a .tmpl file, rendered rather than linked) is listed by its own name,
# suffix included. Paths under .vault/ (files written into the workspace's vault, not linked into the workspace) are
# listed from .vault/ too.
#
# `needs` are dotted config keys or sections (tracker, tracker.jira, workspace.areas) the feature's items read. A
# workspace that picks a feature whose needs its config leaves out or leaves empty is a problem, and the installer
# leaves that workspace as it is until the config gains them or drops the feature. Rules within the config (a vault
# tracker needs a vault, whatever the features) are config.py's validation, not needs.
#
# Example:
#   services-lock:
#     paths:
#       - .claude/skills/start-local-services
#       - .claude/toolbox/bin/services_lock.py
#     needs: [workspace.areas]

# `_commands.py` (the helper the gates share) is unlisted on purpose: it must install wherever any gate does, and a path
# listed under two features needs both.
git:
  - .claude/hooks/gates/pre_tool_use/git_write_gate.py
  - .claude/rules/git-conventions.md
  - .claude/skills/git-commit
  - .claude/skills/git-delete-merged-branches
  - .claude/skills/git-draft-commit-message

verify:
  - .claude/agents/change-verifier.md
  - .claude/skills/verify-change

tests:
  paths:
    - .claude/agents/check-runner.md
    - .claude/hooks/gates/pre_tool_use/checks_gate.py
    - .claude/hooks/gates/pre_tool_use/raw_output_gate.py
    - .claude/skills/run-unit-tests
  needs: [workspace.areas]

intellij:
  - .claude/skills/intellij-open-worktree

services-lock:
  paths:
    - .claude/skills/start-local-services
    - .claude/skills/stop-local-services
    - .claude/toolbox/bin/services_lock.py
  needs: [workspace.areas]

review-ui:
  - .claude/skills/local-review-ui

worktrees:
  - .claude/hooks/gates/pre_tool_use/main_checkout_gate.py
  - .claude/skills/git-worktrees

pr:
  - .claude/skills/gh-create-pull-request
  - .claude/skills/gh-merge-pull-request

# Task records live in the vault's tasks folder whatever the tracker.
tasks:
  paths:
    - .claude/rules/ticket-docs.md
    - .claude/skills/create-defect
    - .claude/skills/create-tickets
    - .claude/skills/propose-tickets
    - .claude/skills/work-task
  needs: [tracker, vault]

jira:
  paths:
    - .claude/agents/jira-filer.md.tmpl
  needs: [tracker.jira]

jira-sprints:
  paths:
    - .claude/skills/jira-find-current-sprint
  needs: [tracker.jira]

dispatcher:
  - .claude/skills/work-tasks
  - .claude/toolbox/bin/dispatch.py

# The discussion-plan template reads tracker.kind as well as the vault (`kind: none` for a vault with no tickets).
obsidian:
  paths:
    - .vault
  needs: [vault, tracker]

# Knowledge skills: Allen's conventions for a stack, loaded when Claude judges a description relevant.
java:
  - .claude/skills/java-conventions
  - .claude/skills/java-testing-conventions

spring:
  - .claude/skills/spring-boot-conventions

postgres:
  - .claude/skills/database-conventions

angular:
  - .claude/skills/angular-conventions

playwright:
  - .claude/skills/playwright-conventions

bruno:
  - .claude/skills/bruno-api-collections
